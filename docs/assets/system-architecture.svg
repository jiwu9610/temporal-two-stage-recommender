<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1400" height="560" fill="#ffffff"/>

  <!-- legend -->
  <g font-size="13" fill="#475569">
    <rect x="1052" y="26" width="28" height="15" rx="3" fill="#f8fafc" stroke="#0d9488" stroke-width="2.2"/>
    <text x="1088" y="38">adopted pipeline</text>
    <rect x="1218" y="26" width="28" height="15" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="1254" y="38">evaluated, not adopted</text>
  </g>

  <!-- MAIN PATH -->
  <g>
    <rect x="28" y="130" width="188" height="150" rx="12" fill="#f8fafc" stroke="#0d9488" stroke-width="3"/>
    <text x="122" y="188" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Amazon</text>
    <text x="122" y="214" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Reviews 2023</text>
    <text x="122" y="248" text-anchor="middle" font-size="14.5" fill="#475569">interactions · metadata</text>
  </g>
  <line x1="216" y1="205" x2="252" y2="205" stroke="#0d9488" stroke-width="4" marker-end="url(#am)"/>

  <g>
    <rect x="260" y="130" width="196" height="150" rx="12" fill="#f8fafc" stroke="#0d9488" stroke-width="3"/>
    <text x="358" y="195" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Temporal</text>
    <text x="358" y="221" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">pipeline</text>
    <text x="358" y="253" text-anchor="middle" font-size="14.5" fill="#475569">point-in-time features</text>
  </g>
  <line x1="456" y1="205" x2="492" y2="205" stroke="#0d9488" stroke-width="4" marker-end="url(#am)"/>

  <g>
    <rect x="500" y="82" width="246" height="246" rx="12" fill="#f8fafc" stroke="#0d9488" stroke-width="3"/>
    <text x="623" y="114" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Multi-source retrieval</text>
    <g font-size="15" fill="#134e4a" font-weight="600">
      <rect x="518" y="130" width="210" height="32" rx="7" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.5"/>
      <text x="623" y="151" text-anchor="middle">Popularity / Recency</text>
      <rect x="518" y="168" width="210" height="32" rx="7" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.5"/>
      <text x="623" y="189" text-anchor="middle">Category affinity</text>
      <rect x="518" y="206" width="210" height="32" rx="7" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.5"/>
      <text x="623" y="227" text-anchor="middle">Two-tower retrieval</text>
      <rect x="518" y="244" width="210" height="32" rx="7" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.5"/>
      <text x="623" y="265" text-anchor="middle">Content retrieval</text>
      <rect x="518" y="282" width="210" height="32" rx="7" fill="#ecfdf5" stroke="#5eead4" stroke-width="1.5"/>
      <text x="623" y="303" text-anchor="middle">Eligibility filtering</text>
    </g>
  </g>
  <line x1="746" y1="205" x2="782" y2="205" stroke="#0d9488" stroke-width="4" marker-end="url(#am)"/>

  <g>
    <rect x="790" y="130" width="196" height="150" rx="12" fill="#f8fafc" stroke="#0d9488" stroke-width="3"/>
    <text x="888" y="195" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Candidate</text>
    <text x="888" y="221" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">union</text>
    <text x="888" y="253" text-anchor="middle" font-size="14.5" fill="#475569">dedup · recall ceiling</text>
  </g>
  <line x1="986" y1="205" x2="1022" y2="205" stroke="#0d9488" stroke-width="4" marker-end="url(#am)"/>

  <g>
    <rect x="1030" y="118" width="212" height="174" rx="12" fill="#f8fafc" stroke="#0d9488" stroke-width="3"/>
    <text x="1136" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Neural ranker</text>
    <text x="1136" y="186" text-anchor="middle" font-size="14" fill="#475569">DCN / MLP · frozen per domain</text>
    <text x="1136" y="230" text-anchor="middle" font-size="14.5" fill="#475569">user / item / retrieval</text>
    <text x="1136" y="250" text-anchor="middle" font-size="14.5" fill="#475569">/ temporal signals</text>
  </g>
  <line x1="1242" y1="205" x2="1278" y2="205" stroke="#0d9488" stroke-width="4" marker-end="url(#am)"/>

  <g>
    <rect x="1286" y="142" width="92" height="126" rx="12" fill="#0d9488"/>
    <text x="1332" y="188" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">Top-K</text>
    <text x="1332" y="211" text-anchor="middle" font-size="15" font-weight="600" fill="#ccfbf1">ranked</text>
    <text x="1332" y="230" text-anchor="middle" font-size="15" font-weight="600" fill="#ccfbf1">items</text>
  </g>

  <!-- sequence residual branch -->
  <g>
    <rect x="960" y="392" width="352" height="92" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="1136" y="432" text-anchor="middle" font-size="18" font-weight="700" fill="#7c2d12">DCN score + α · sequence residual</text>
    <text x="1136" y="460" text-anchor="middle" font-size="13.5" fill="#92400e">Transformer · SASRec · HSTU variants</text>
  </g>
  <rect x="1006" y="486" width="260" height="38" rx="19" fill="#b45309"/>
  <text x="1136" y="511" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="1.2">EVALUATED · NOT ADOPTED</text>
  <line x1="1136" y1="392" x2="1136" y2="300" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#ao)"/>

  <!-- compact protocol strip -->
  <g>
    <rect x="28" y="418" width="760" height="64" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="60" y="456" font-size="16" fill="#334155">
      <tspan font-weight="700">Evaluation protocol:</tspan>
      <tspan dx="10">Point-in-time features</tspan>
      <tspan dx="10" fill="#0d9488" font-weight="700">→</tspan>
      <tspan dx="10">Frozen model selection</tspan>
      <tspan dx="10" fill="#0d9488" font-weight="700">→</tspan>
      <tspan dx="10">One-shot locked test</tspan>
    </text>
  </g>
</svg>
