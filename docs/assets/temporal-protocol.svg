<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="tax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1400" height="540" fill="#ffffff"/>

  <!-- time axis -->
  <line x1="90" y1="70" x2="1330" y2="70" stroke="#334155" stroke-width="2.5" marker-end="url(#tax)"/>
  <text x="1352" y="75" font-size="15" fill="#334155">time</text>
  <g font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">
    <line x1="440" y1="58" x2="440" y2="500" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 5"/>
    <line x1="730" y1="58" x2="730" y2="500" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 5"/>
    <line x1="1020" y1="58" x2="1020" y2="500" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 5"/>
    <line x1="1310" y1="58" x2="1310" y2="500" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 5"/>
    <text x="440" y="48">T₀</text><text x="730" y="48">T₁</text><text x="1020" y="48">T₂</text><text x="1310" y="48">T₃</text>
  </g>
  <text x="90" y="48" font-size="14" fill="#64748b">global calendar cutoffs, shared by every user</text>

  <!-- row 1: ranker training -->
  <g>
    <text x="90" y="128" font-size="18" font-weight="700" fill="#0f172a">1 · Ranker training</text>
    <rect x="90" y="142" width="350" height="40" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="265" y="168" text-anchor="middle" font-size="15" fill="#134e4a" font-weight="600">history: everything before T₀</text>
    <rect x="440" y="142" width="290" height="40" rx="8" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="1 0"/>
    <text x="585" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9488">labels: positives in [T₀, T₁)</text>
  </g>

  <!-- row 2: model selection -->
  <g>
    <text x="90" y="238" font-size="18" font-weight="700" fill="#0f172a">2 · Model selection</text>
    <rect x="90" y="252" width="640" height="40" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="410" y="278" text-anchor="middle" font-size="15" fill="#134e4a" font-weight="600">history: everything before T₁</text>
    <rect x="730" y="252" width="290" height="40" rx="8" fill="none" stroke="#0d9488" stroke-width="2.5"/>
    <text x="875" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9488">labels: positives in [T₁, T₂)</text>
    <text x="1040" y="272" font-size="14.5" fill="#475569">architecture, learning rate, and</text>
    <text x="1040" y="290" font-size="14.5" fill="#475569">epoch count are selected here</text>
    <text x="1040" y="310" font-size="13.5" font-weight="700" fill="#0d9488">No test feedback</text>
  </g>

  <!-- freeze marker -->
  <g>
    <rect x="880" y="330" width="280" height="36" rx="18" fill="#334155"/>
    <text x="1020" y="354" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">🔒 FREEZE — before any test read</text>
  </g>

  <!-- row 3: locked test -->
  <g>
    <text x="90" y="412" font-size="18" font-weight="700" fill="#0f172a">3 · Locked test</text>
    <rect x="90" y="426" width="930" height="40" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="555" y="452" text-anchor="middle" font-size="15" fill="#134e4a" font-weight="600">history: everything before T₂</text>
    <rect x="1020" y="426" width="290" height="40" rx="8" fill="#134e4a"/>
    <text x="1165" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">labels: positives in [T₂, T₃)</text>
    <text x="1165" y="461" text-anchor="middle" font-size="12.5" fill="#99f6e4">read ONCE</text>
  </g>

  <!-- bottom principles -->
  <g font-size="14.5" fill="#334155">
    <text x="90" y="512"><tspan font-weight="700">Point-in-time inputs:</tspan> features, popularity statistics, item vocabulary, and retrieval candidates use only information available before each cutoff.</text>
    <text x="90" y="532"><tspan font-weight="700">Ground truth:</tspan> every positively-rated interaction in the window (multi-positive), not just the next item.</text>
  </g>
</svg>
